          - listitem [ref=f12e383]:
            - generic [ref=f12e385]: "2"
            - generic [ref=f12e386]:
              - heading "Book a permit if the trek needs one" [level=3] [ref=f12e387]
              - paragraph [ref=f12e388]:
                - text: Some treks need a booking with the Karnataka Forest Department. Book those on
                - link "Aranya Vihaara" [ref=f12e389] [cursor=pointer]:
