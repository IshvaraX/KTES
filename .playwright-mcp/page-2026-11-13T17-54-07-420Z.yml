      - generic [ref=f11e373]:
        - heading "How trek plans work" [level=2] [ref=f11e374]
        - paragraph [ref=f11e375]: A trek plan is a shared sheet for your group, not an official permit. Everyone gets their own page, so a split group still has what it needs.
        - list [ref=f11e376]:
          - listitem [ref=f11e377]:
            - generic [ref=f11e379]: "1"
            - generic [ref=f11e380]:
              - heading "Pick a trail" [level=3] [ref=f11e381]
              - paragraph [ref=f11e382]: Start from any trail above, or type in the trek you have planned.
          - listitem [ref=f11e383]:
            - generic [ref=f11e385]: "2"
            - generic [ref=f11e386]:
              - heading "Book a permit if the trek needs one" [level=3] [ref=f11e387]
              - paragraph [ref=f11e388]:
                - text: Some treks need a booking with the Karnataka Forest Department. Book those on
                - link "Aranya Vihaara" [ref=f11e389] [cursor=pointer]:
                  - /url: https://aranyavihaara.karnataka.gov.in/
                - text: ", the official site. KTES can't book treks or issue permits."
          - listitem [ref=f11e390]:
            - generic [ref=f11e392]: "3"
            - generic [ref=f11e393]:
              - heading "Add your group" [level=3] [ref=f11e394]
              - paragraph [ref=f11e395]: Leader details, an emergency contact, and a photo for each person.
          - listitem [ref=f11e396]:
            - generic [ref=f11e398]: "4"
            - generic [ref=f11e399]:
              - heading "Download the PDF" [level=3] [ref=f11e400]
              - paragraph [ref=f11e401]: A cover sheet for the group, then one page per trekker with a QR that opens the trailhead in Google Maps.
          - listitem [ref=f11e402]:
            - generic [ref=f11e403]: "5"
            - generic [ref=f11e404]:
              - heading "Carry it on the trek" [level=3] [ref=f11e405]
              - paragraph [ref=f11e406]: Keep it with any official ticket or permit, on your phone or on paper, until everyone is back down.
