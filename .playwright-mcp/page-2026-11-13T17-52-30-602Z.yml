          - listitem [ref=f10e383]:
            - generic [ref=f10e385]: "2"
            - generic [ref=f10e386]:
              - heading "Book a permit if the trek needs one" [level=3] [ref=f10e387]
              - paragraph [ref=f10e388]:
                - text: Some treks need a booking with the Karnataka Forest Department. Book those on
                - link "Aranya Vihaara" [ref=f10e389] [cursor=pointer]:
                  - /url: https://aranyavihaara.karnataka.gov.in/
                - text: ", the official site. KTES can't book treks or issue permits."
          - listitem [ref=f10e390]:
