  - contentinfo [ref=f10e413]:
    - generic [ref=f10e414]:
      - generic [ref=f10e415]:
        - paragraph [ref=f10e416]: KTESKarnataka Trekking Exploration Site
        - paragraph [ref=f10e417]:
          - text: A community guide to treks around Bangalore, made by trekkers. This isn't a government website, and trek plans made here aren't permits. For official trek bookings, use
          - link "Aranya Vihaara" [ref=f10e418] [cursor=pointer]:
            - /url: https://aranyavihaara.karnataka.gov.in/
          - text: ", run by the Karnataka Forest Department."
      - paragraph [ref=f10e419]: Start early, carry water, and bring your litter back down.