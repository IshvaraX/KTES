  - contentinfo [ref=f9e413]:
    - generic [ref=f9e414]:
      - generic [ref=f9e415]:
        - paragraph [ref=f9e416]: KTESKarnataka Trekking Exploration Site
        - paragraph [ref=f9e417]:
          - text: A community guide to treks around Bangalore, made by trekkers. This isn't a government website, and trek plans made here aren't permits. For official trek bookings, use
          - link "Aranya Vihaara" [ref=f9e418] [cursor=pointer]:
            - /url: https://aranyavihaara.karnataka.gov.in/
          - text: ", run by the Karnataka Forest Department."
      - paragraph [ref=f9e419]: Start early, carry water, and bring your litter back down.