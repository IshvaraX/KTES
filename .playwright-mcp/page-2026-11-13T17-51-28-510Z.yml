        - heading "How trek plans work" [level=2] [ref=f9e374]
        - paragraph [ref=f9e375]: A trek plan is a shared sheet for your group, not an official permit. Everyone gets their own page, so a split group still has what it needs.
        - list [ref=f9e376]:
          - listitem [ref=f9e377]:
            - generic [ref=f9e379]: "1"
            - generic [ref=f9e380]:
              - heading "Pick a trail" [level=3] [ref=f9e381]
              - paragraph [ref=f9e382]: Start from any trail above, or type in the trek you have planned.
          - listitem [ref=f9e383]:
            - generic [ref=f9e385]: "2"
            - generic [ref=f9e386]:
              - heading "Book a permit if the trek needs one" [level=3] [ref=f9e387]
              - paragraph [ref=f9e388]:
                - text: Some treks need a booking with the Karnataka Forest Department. Book those on
                - link "Aranya Vihaara" [ref=f9e389] [cursor=pointer]:
                  - /url: https://aranyavihaara.karnataka.gov.in/
                - text: ", the official site. KTES can't book treks or issue permits."
          - listitem [ref=f9e390]:
            - generic [ref=f9e392]: "3"
            - generic [ref=f9e393]:
              - heading "Add your group" [level=3] [ref=f9e394]
              - paragraph [ref=f9e395]: Leader details, an emergency contact, and a photo for each person.
          - listitem [ref=f9e396]:
            - generic [ref=f9e398]: "4"
            - generic [ref=f9e399]:
              - heading "Download the PDF" [level=3] [ref=f9e400]
              - paragraph [ref=f9e401]: A cover sheet for the group, then one page per trekker with a QR that opens the trailhead in Google Maps.
          - listitem [ref=f9e402]:
            - generic [ref=f9e403]: "5"
            - generic [ref=f9e404]:
              - heading "Carry it on the trek" [level=3] [ref=f9e405]
              - paragraph [ref=f9e406]: Keep it with any official ticket or permit, on your phone or on paper, until everyone is back down.
