        - heading "How trek plans work" [level=2] [ref=f8e374]
        - paragraph [ref=f8e375]: A trek plan is a shared sheet for your group, not an official permit. Everyone gets their own page, so a split group still has what it needs.
        - list [ref=f8e376]:
          - listitem [ref=f8e377]:
            - generic [ref=f8e379]: "1"
            - generic [ref=f8e380]:
              - heading "Pick a trail" [level=3] [ref=f8e381]
              - paragraph [ref=f8e382]: Start from any trail above, or type in the trek you have planned.
          - listitem [ref=f8e383]:
            - generic [ref=f8e385]: "2"
            - generic [ref=f8e386]:
              - heading "Book a permit if the trek needs one" [level=3] [ref=f8e387]
              - paragraph [ref=f8e388]:
                - text: Some treks need a booking with the Karnataka Forest Department. Book those on
                - link "Aranya Vihaara" [ref=f8e389] [cursor=pointer]:
                  - /url: https://aranyavihaara.karnataka.gov.in/
                - text: ", the official site. KTES can't book treks or issue permits."
          - listitem [ref=f8e390]:
            - generic [ref=f8e392]: "3"
            - generic [ref=f8e393]:
              - heading "Add your group" [level=3] [ref=f8e394]
              - paragraph [ref=f8e395]: Leader details, an emergency contact, and a photo for each person.
          - listitem [ref=f8e396]:
            - generic [ref=f8e398]: "4"
            - generic [ref=f8e399]:
              - heading "Download the PDF" [level=3] [ref=f8e400]
