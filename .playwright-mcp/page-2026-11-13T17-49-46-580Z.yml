  - contentinfo [ref=f8e413]:
    - generic [ref=f8e414]:
      - generic [ref=f8e415]:
        - paragraph [ref=f8e416]: KTESKarnataka Trekking Exploration Site
        - paragraph [ref=f8e417]:
          - text: A community guide to treks around Bangalore, made by trekkers. This isn't a government website, and trek plans made here aren't permits. For official trek bookings, use
          - link "Aranya Vihaara" [ref=f8e418] [cursor=pointer]:
            - /url: https://aranyavihaara.karnataka.gov.in/
          - text: ", run by the Karnataka Forest Department."
      - paragraph [ref=f8e419]: Start early, carry water, and bring your litter back down.